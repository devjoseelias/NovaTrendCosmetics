<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="../css/test.css" />
    <link rel="stylesheet" href="../css/menu.css">
    <link rel="icon" type="image/webp" href="../assets/Images/logo/Logotipo_Nova_Trend.webp">
    </link>
    <title>Test Skincare | Nova Trend Cosmetics</title>
</head>

<body>

    <header class="header">
        <nav class="header-nav-bar">
            <div class="logo-container">
                <img src="../assets/Images/logo/Logotipo_Nova_Trend.webp" alt="Nova Trend Cosmetics Logo" />
            </div>

            <h1 class="name">Nova Trend Cosmetics</h1>

            <div class="header-button" id="header-button">
                <i class="fa-solid fa-bars"></i>
            </div>

            <ul class="nav-list" id="deployableMenu">

                <li class="list-item">
                    <a href="../index.html" class="nav-link">
                        <i class="fa-solid fa-house"></i>
                        <span class="nav-text">Inicio</span>
                    </a>
                </li>

                <li class="list-item">
                    <a href="./catalogo.html" class="nav-link">
                        <i class="fa-solid fa-image"></i>
                        <span class="nav-text">Productos</span>
                    </a>
                </li>

                <li class="list-item">
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-file"></i>
                        <span class="nav-text">Test de skincare</span>
                    </a>
                </li>

                <li class="list-item">
                    <a href="https://nova-trend-cosmetics.myshopify.com" target="_blank" class="nav-link">
                        <i class="fa-solid fa-shop"></i>
                        <span class="nav-text">Tienda en línea</span>
                    </a>
                </li>

                <li class="list-item">
                    <a href="../index.html#contacto" class="nav-link">
                        <i class="fa-solid fa-address-book"></i>
                        <span class="nav-text">Contacto</span>
                    </a>
                </li>

            </ul>
        </nav>
    </header>

    <main class="main" id="main">

        <section class="hero" id="hero">
            <div class="text-container">
                <h1 class="hero-title">Bienvenido al <span class="highlight">glow</span></h1>
                <p class="hero-text">de un cuidado real, para una piel real</p>
                <h2 class="hero-brand-name">Nova Trend Cosmetics</h2>
            </div>
            <div class="image-container">
                <img src="../assets/Images/other_pages/Serum_Acido_Hialuronico.png"
                    alt="Sérum Ácido Hialurónico Nova Trend Cosmetics">
            </div>
        </section>

        <section class="test" id="test">
            <h2 class="test-title">Elige tu producto <span class="highlight2">ideal</span></h2>
            <div class="select-container">
                <label for="categorias">Selecciona tu caso:</label>
                <select class="categorias" id="categorias">
                    <option value="1" selected>Acné</option>
                    <option value="2">Resequedad</option>
                    <option value="3">Manchas</option>
                    <option value="4">Tonos irregulares</option>
                    <option value="5">Signos de edad</option>
                    <option value="6">Piel grasa</option>
                    <option value="7">Piel opaca</option>
                </select>
            </div>
            <div class="products"></div>
        </section>
    </main>

    <script src="../js/main.js"></script>
    <script src="../js/test.js"></script>
</body>

</html>
