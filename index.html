<!doctype html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />
    <link rel="stylesheet" href="css/style.css" />
    <title>Nova Trend Cosmetics</title>
</head>

<body>
    <header class="header">
        <nav class="header-nav-bar">
            <div class="logo-container">
                <img src="assets/Images/Logo/Logotipo_Nova_Trend.png" alt="Nova Trend Cosmetics Logo" />
            </div>
            <h1 class="name">Nova Trend Cosmetics</h1>
            <div class="header-button" id="header-button">
                <i class="fa-solid fa-bars"></i>
            </div>
            <ul class="nav-list" id="deployableMenu">
                <li class="list-item">
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-house"></i>
                        <span class="nav-text">Inicio</span>
                    </a>
                </li>
                <li class="list-item">
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-image"></i>
                        <span class="nav-text">Productos</span>
                    </a>
                </li>
                <li class="list-item">
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-file"></i>
                        <span class="nav-text">Test de skincare</span>
                    </a>
                </li>
                <li class="list-item">
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-shop"></i>
                        <span class="nav-text">Tienda en línea</span>
                    </a>
                </li>
                <li class="list-item">
                    <a href="#" class="nav-link">
                        <i class="fa-solid fa-address-book"></i>
                        <span class="nav-text">Contacto</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>
    <main class="main" id="main">
        <section class="hero" id="hero">
            <div class="hero-banner" id="hero-banner">
                <a href="" class="hero-link" id="hero-link"><img src="assets/Images/Hero Section/hero_celular.png"
                        alt="Hacer test gratuito." class="hero-image" id="hero-image" /></a>
            </div>
            <div class="hero-button" id="hero-button">
                <a href="" class="skincare-test">¡Haz tu test gratis!</a>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
</body>

</html>
